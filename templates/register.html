<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão da Copa - Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome para o ícone de câmera -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-dark">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-success text-white text-center">
                    <h4>⚽ Cadastre-se no Bolão</h4>
                </div>
                <div class="card-body">
                    <form action="{{ url_for('auth.register') }}" method="POST" enctype="multipart/form-data" class="needs-validation" novalidate>
                        
                        <!-- Upload de Foto com Preview -->
                        <div class="mb-3 text-center">
                            <label class="form-label d-block text-secondary small">Foto de Perfil (Opcional)</label>
                            <div class="d-flex justify-content-center">
                                <label for="foto" class="btn btn-outline-success position-relative p-0 rounded-circle" style="width: 100px; height: 100px; overflow: hidden; border-style: dashed; border-width: 2px;">
                                    <i class="fas fa-camera position-absolute top-50 start-50 translate-middle opacity-50" id="camera-icon"></i>
                                    <input type="file" class="form-control d-none" name="foto" id="foto" accept="image/*" onchange="previewImage(this)">
                                    <img id="preview" src="{{ url_for('static', filename='img/profiles/default.png') }}" class="w-100 h-100 object-fit-cover d-none">
                                </label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nickname</label>
                            <input type="text" class="form-control" name="name" required minlength="3">
                            <div class="invalid-feedback">Por favor, insira um nome válido.</div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">E-mail</label>
                            <input type="email" class="form-control" placeholder="seu_email@email.com" name="email" required>
                            <div class="invalid-feedback">Por favor, insira um e-mail no formato correto.</div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Celular</label>
                            <input type="text" class="form-control" name="phone" id="phone" placeholder="(11) 99999-9999" maxlength="15">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Senha</label>
                            <div class="input-group">
                                <input type="password" class="form-control" name="password" id="passwordInput" required minlength="6"
                                       data-bs-toggle="popover" 
                                       data-bs-trigger="focus" 
                                       data-bs-placement="top"
                                       title="⚠️ Aviso de Segurança" 
                                       data-bs-content="Como este é um bolão para diversão, por favor NÃO utilize a mesma senha do seu banco ou e-mail pessoal. Não garantimos a segurança absoluta dos dados!">
                                
                                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                    👁️
                                </button>
                                
                                <div class="invalid-feedback">A senha deve ter pelo menos 6 caracteres.</div>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-success w-100">Criar Conta</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function previewImage(input) {
    const preview = document.getElementById('preview');
    const icon = document.getElementById('camera-icon');
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            preview.src = e.target.result;
            preview.classList.remove('d-none');
            icon.classList.add('d-none');
        }
        reader.readAsDataURL(input.files[0]);
    }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/scripts.js') }}"></script>

</body>
</html>
